name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  REPOSITORY_URL: https://git.lab.itsnova.sh/nova/glacier

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Run build
        run: cargo build --locked --release
      
      - name: Upload build artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: glacier
          path: target/release/glacier
  
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install git-cliff
        run: cargo install git-cliff --locked
      
      - name: Generate release notes
        run: git cliff --current --strip header > RELEASE_NOTES.md
      
      - name: Download build artifact
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: glacier
          path: release
      
      - name: Prepare release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          cp release/glacier dist/release/glacier-${VERSION}-linux-x86_64
      
      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-notes-file: RELEASE_NOTES.md
          token: ${{ secrets.RELEASE_TOKEN }}
